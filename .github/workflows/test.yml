# 스킬 시험: 스크립트 시험, 문서 참조 검사, 설치 스크립트를 Windows·macOS·Linux에서 돌린다
name: test

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'install.sh'
      - 'install.ps1'
      - 'CLAUDE.md'
      - 'README*.md'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'install.sh'
      - 'install.ps1'
      - 'CLAUDE.md'
      - 'README*.md'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: score.js 시험
        run: node skills/haejo/tests/score/run.js
      - name: status.js 시험
        run: node skills/haejo/tests/run.js
      - name: check-update.js 시험
        run: node skills/haejo/tests/check-update.js
      - name: 문서 참조 검사
        run: node tests/check-refs.js

      # checkout은 태그를 받지 않아 version이 null일 수 있다. 기록 파일이 생겼는지만 본다
      - name: install.sh 설치 뒤 --check
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home-sh"
          mkdir -p "$HOME"
          bash install.sh
          test -f "$HOME/.claude/claude-haejo.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$HOME/.claude/claude-haejo.json"
          bash install.sh --check
          node skills/haejo/scripts/check-update.js --home "$HOME" --remote "$RUNNER_TEMP/no-such-repo"

      # 옛 하위 스킬 폴더: 설치 때 알림, --check exit 1, 미리 보기 조합(--dry-run·--check와 --prune)은 안 지움,
      # 모르는 옵션·안 맞는 조합 exit 2, *.local.md가 든 폴더는 --prune이 남김, 비우면 --prune 뒤 --check exit 0
      - name: install.sh 옛 하위 스킬 폴더 알림과 --prune
        shell: bash
        run: bash tests/install-old.sh "$RUNNER_TEMP/old-sh"

      # install.ps1은 Windows용이다(macOS·Linux는 install.sh)
      - name: install.ps1 설치 뒤 -Check (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'home-pwsh'
          New-Item -ItemType Directory -Force $h | Out-Null
          ./install.ps1 -HomeDir $h
          $j = Join-Path $h '.claude/claude-haejo.json'
          if (-not (Test-Path $j)) { throw 'claude-haejo.json 없음' }
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" $j
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./install.ps1 -HomeDir $h -Check

      # 빈 CLAUDE.md가 있어도 멈추지 않고 버전 기록까지 써야 한다
      - name: install.ps1 빈 CLAUDE.md (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'home-pwsh-empty'
          New-Item -ItemType Directory -Force (Join-Path $h '.claude') | Out-Null
          New-Item -ItemType File -Force (Join-Path $h '.claude/CLAUDE.md') | Out-Null
          ./install.ps1 -HomeDir $h
          if (-not (Test-Path (Join-Path $h '.claude/claude-haejo.json'))) { throw 'claude-haejo.json 없음' }
          if ((Get-Item (Join-Path $h '.claude/CLAUDE.md')).Length -ne 0) { throw '빈 CLAUDE.md를 덮었다' }

      - name: install.ps1 옛 하위 스킬 폴더 알림과 -Prune (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/install-old.ps1 (Join-Path $env:RUNNER_TEMP 'old-pwsh-inline') -Way inline
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./tests/install-old.ps1 (Join-Path $env:RUNNER_TEMP 'old-pwsh-file') -Way file
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: install.ps1 설치 뒤 -Check (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'home-ps51'
          New-Item -ItemType Directory -Force $h | Out-Null
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -HomeDir $h
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $j = Join-Path $h '.claude\claude-haejo.json'
          if (-not (Test-Path $j)) { throw 'claude-haejo.json 없음' }
          # BOM 없는 UTF-8이어야 한다(JSON.parse는 BOM이 있으면 실패)
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" $j
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -HomeDir $h -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: install.ps1 빈 CLAUDE.md (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'home-ps51-empty'
          New-Item -ItemType Directory -Force (Join-Path $h '.claude') | Out-Null
          New-Item -ItemType File -Force (Join-Path $h '.claude\CLAUDE.md') | Out-Null
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -HomeDir $h
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path (Join-Path $h '.claude\claude-haejo.json'))) { throw 'claude-haejo.json 없음' }
          if ((Get-Item (Join-Path $h '.claude\CLAUDE.md')).Length -ne 0) { throw '빈 CLAUDE.md를 덮었다' }

      - name: install.ps1 옛 하위 스킬 폴더 알림과 -Prune (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\tests\install-old.ps1 (Join-Path $env:RUNNER_TEMP 'old-ps51-inline') -Way inline
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy Bypass -File .\tests\install-old.ps1 (Join-Path $env:RUNNER_TEMP 'old-ps51-file') -Way file
          if ($LASTEXITCODE -ne 0) { exit 1 }
